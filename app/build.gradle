plugins { id 'com.android.application' }

android {
    namespace 'com.ema.mayoreo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ema.mayoreo'
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            debuggable false
        }
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

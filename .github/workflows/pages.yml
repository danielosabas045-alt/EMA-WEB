name: EMA Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ema-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compilar EMA Enterprise desde el código editable
        run: |
          unzip -q EMA-Enterprise.zip -d "$RUNNER_TEMP/ema-source"
          cd "$RUNNER_TEMP/ema-source/EMA-Enterprise"
          for file in web/*.js; do node --check "$file"; done
          python3 build_web.py "$GITHUB_WORKSPACE/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar EMA
        id: deployment
        uses: actions/deploy-pages@v4

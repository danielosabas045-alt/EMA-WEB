name: EMA Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ema-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compilar EMA Enterprise desde el código editable
        run: |
          for file in web/*.js; do node --check "$file"; done
          python3 build_web.py "$GITHUB_WORKSPACE/site"
      - name: Empaquetar distribución desde el commit
        run: git archive --format=zip --prefix=EMA-Enterprise/ -o EMA-Enterprise.zip HEAD web android app tests .github .gitignore README.md build_web.py android_prepare.py android-mobile.css android-mobile.js build.gradle settings.gradle gradle.properties
      - uses: actions/upload-artifact@v4
        with:
          name: EMA-Enterprise-fuentes
          path: EMA-Enterprise.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar EMA
        id: deployment
        uses: actions/deploy-pages@v4
